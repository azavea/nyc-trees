language: python
python:
  - "2.7"

cache: apt

services:
  - redis-server

addons:
  postgresql: "9.3"

env:
  global:
    - NYC_TREES_DB_NAME=nyc_trees
    - NYC_TREES_DB_USER=nyc_trees
    - NYC_TREES_DB_PASSWORD=nyc_trees
    - NYC_TREES_DB_HOST=localhost
    - NYC_TREES_DB_PORT=5432
    - DJANGO_SETTINGS_MODULE=nyc_trees.settings.test

before_script:
  - psql -U postgres -c "create database nyc_trees;"
  - psql -U postgres -c "create extension postgis;"
  - sudo mv /etc/apt/sources.list.d/pgdg-source.list* /tmp
  - sudo apt-get remove -y libgdal1
  - sudo add-apt-repository -y ppa:ubuntugis/ubuntugis-unstable
  - sudo apt-get update -y
  - sudo apt-get install -y binutils libproj-dev gdal-bin

  - pushd src/nyc_trees/requirements
  -     sudo pip install -r test.txt
  - popd

script:
  - pushd src/nyc_trees
  -     sudo python manage.py test --noinput
  - popd
